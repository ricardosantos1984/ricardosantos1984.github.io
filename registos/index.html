<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registos de Trabalho</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 18h28v6H18zM18 30h28v6H18zM18 42h18v6H18z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#e3e7ef;--txt:#1d2433;--mut:#6b7385;--pri:#2563eb;--pri2:#1d4ed8;--side:#111827;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
/* Bloqueio */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111827,#1e3a8a)}
.lockbox{background:#fff;border-radius:14px;padding:32px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lockbox h1{margin:0 0 4px;font-size:22px}
.lockbox p{color:var(--mut);margin:0 0 18px}
.lockbox input{width:100%;margin-bottom:10px}
.lockbox .links{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.lockbox .links a{color:var(--mut);cursor:pointer}
.err{color:var(--bad);min-height:18px;font-size:13px}
/* Layout */
#app{display:flex;height:100vh}
aside{width:220px;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 18px 14px;font-weight:700;color:#fff;font-size:16px;display:flex;gap:10px;align-items:center}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-style:normal}
nav{flex:1;padding:6px 10px;overflow:auto}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
nav button:hover{background:#1f2937;color:#fff}
nav button.on{background:var(--pri);color:#fff}
nav .cnt{margin-left:auto;font-size:11px;background:#374151;border-radius:10px;padding:1px 7px}
nav button.on .cnt{background:rgba(255,255,255,.25)}
.sidefoot{padding:12px}
.sync{font-size:12px;margin-bottom:8px;color:#9ca3af;text-align:center}
.sync.warn{color:#fbbf24}
.lockbox .links{gap:14px}.lockbox .links a{max-width:60%}
.sidefoot button{width:100%;background:#1f2937;border-color:#374151;color:#e5e7eb}.sidefoot button:hover{background:#374151}
main{flex:1;overflow:auto;padding:24px 28px}
h2{margin:0;font-size:21px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.top .sp{flex:1}
/* Controlos */
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:80px;resize:vertical;width:100%}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f1f4f9}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:var(--pri2)}
.btn.d{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.ib{border:0;background:none;cursor:pointer;padding:2px 4px;border-radius:5px;text-decoration:none;font-size:13px}
.ib:hover{background:#e8edf5}
/* Tabelas */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfd}
th:first-child{border-top-left-radius:12px}th:last-child{border-top-right-radius:12px}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8faff}
td.act{white-space:nowrap;text-align:right;width:1%}
td a{color:var(--pri)}
code{background:#f1f4f9;padding:2px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:12.5px}
.muted{color:var(--mut)}
.empty{padding:40px;text-align:center;color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600}
.b-aberta{background:#fee2e2;color:#b91c1c}.b-em-curso{background:#dbeafe;color:#1d4ed8}.b-pendente{background:#fef3c7;color:#b45309}.b-resolvida{background:#dcfce7;color:#15803d}
/* Painel */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat b{display:block;font-size:28px;margin-top:4px}
.stat span{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px;display:flex;align-items:center;justify-content:space-between}
.li{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:center}
.li:last-child{border-bottom:0}
.li:hover{background:#f8faff}
.li .when{font-size:12px;color:var(--mut);min-width:92px}
/* Calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .h{background:#fafbfd;padding:8px;font-size:12px;font-weight:600;color:var(--mut);text-align:center}
.cal .d{background:#fff;min-height:104px;padding:6px;cursor:pointer;overflow:hidden}
.cal .d:hover{background:#f8faff}
.cal .d.o{background:#fafbfd;color:#b0b6c3}
.cal .d.t .n{background:var(--pri);color:#fff;border-radius:50%}
.cal .n{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.ev{display:block;font-size:12px;background:#dbeafe;color:#1e3a8a;border-radius:5px;padding:2px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past{background:#eef0f4;color:#6b7385}
.oc{font-size:11px;color:var(--mut);margin-top:3px}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:10}
.box{background:#fff;border-radius:14px;width:640px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.box h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:17px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:18px 20px}
.fgrid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mut);font-weight:600}
.fgrid label.full{grid-column:1/-1}
.fgrid input,.fgrid select{width:100%}
.pwrow{display:flex;gap:6px}
.foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 14px 14px}
.foot .sp{flex:1}
/* Definições */
.set{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}
.set:last-child{border-bottom:0}
.set div{flex:1}
.set b{display:block}
.set small{color:var(--mut)}
/* Toasts */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:380px;cursor:pointer}
.toast.alarm{background:var(--warn);font-weight:600}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}aside{width:64px}.brand span,nav .lbl,nav .cnt{display:none}}
</style>
</head>
<body>

<div id="lock">
  <div class="lockbox">
    <h1>🗂️ Registos de Trabalho</h1>
    <form id="loginForm" hidden>
      <p>Entre com a conta da aplicação (ex.: info@intranet.pt).</p>
      <input type="email" id="lgEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="lgPw" placeholder="Senha da conta" autocomplete="current-password">
      <div class="err" id="lgErr"></div>
      <button class="btn p" style="width:100%" id="lgBtn">Entrar</button>
    </form>
    <div id="vaultStep">
      <p id="lockMsg">Introduza a senha mestra para desbloquear.</p>
      <form id="lockForm" autocomplete="off">
        <input type="password" id="pw1" placeholder="Senha mestra">
        <input type="password" id="pw2" placeholder="Confirmar senha mestra" hidden>
        <div class="err" id="lockErr"></div>
        <button class="btn p" style="width:100%" id="lockBtn">Desbloquear</button>
      </form>
      <div class="links">
        <a id="lnkLogout">Sair da conta <span id="lgWho"></span></a>
        <a id="lnkReset">Esqueci a senha mestra</a>
      </div>
    </div>
  </div>
</div>

<div id="app" hidden>
  <aside>
    <div class="brand"><i>🗂️</i><span>Registos de Trabalho</span></div>
    <nav id="nav"></nav>
    <div class="sidefoot"><div id="syncSt" class="sync"></div><button class="btn sm" id="btnLock">🔒 Bloquear</button></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" hidden><div class="box"><h3 id="mTitle"></h3><form id="mForm" autocomplete="off"></form></div></div>
<div id="toasts"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script>
"use strict";
/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const enc = new TextEncoder(), dec = new TextDecoder();
function b64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '-');

function toast(msg, alarm) {
  const t = document.createElement('div');
  t.className = 'toast' + (alarm ? ' alarm' : '');
  t.textContent = msg;
  t.onclick = () => t.remove();
  $('#toasts').appendChild(t);
  if (!alarm) setTimeout(() => t.remove(), 3000);
}
async function copyText(v) {
  try { await navigator.clipboard.writeText(v); }
  catch { const ta = document.createElement('textarea'); ta.value = v; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copiado para a área de transferência');
}
function safeUrl(v) {
  v = String(v).trim();
  if (/^(https?|ftp|file|rdp|ssh|mailto|tel):/i.test(v)) return v;
  if (/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) return '#';
  return (/^\d/.test(v) ? 'http://' : 'https://') + v;
}
function pathUrl(p) {
  p = String(p).trim();
  if (p.startsWith('\\\\')) return encodeURI('file:' + p.replace(/\\/g, '/'));
  if (/^[a-zA-Z]:/.test(p)) return encodeURI('file:///' + p.replace(/\\/g, '/'));
  return encodeURI(p);
}
function genPassword(n = 16) {
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?-_+=';
  const r = crypto.getRandomValues(new Uint32Array(n));
  return Array.from(r, x => cs[x % cs.length]).join('');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- cloud (Supabase — mesmo projeto da app "A Nossa Casa") ---------- */
const SUPABASE_URL = 'https://uthotfdcfwrdyivhwkpw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1NO-glUWpi7oEzQUS2xX0A_7TS9qNpu';   // chave pública (publishable)
const TABELA = 'registos_cofre';
const COLS = ['clientes','ocorrencias','eventos','senhas','links','pastas'];
let sb = null, me = '';

/* ---------- cofre encriptado ---------- */
let db = null, cKey = null, cSalt = null, saving = Promise.resolve();
let versao = 0, pendente = false;
const emptyDb = () => ({ clientes: [], ocorrencias: [], eventos: [], senhas: [], links: [], pastas: [], apagados: {}, config: { autoLock: 15 } });
async function derive(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptDb() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cKey, enc.encode(JSON.stringify(db)));
  return { app: 'registos-trabalho', v: 1, salt: b64(cSalt), iv: b64(iv), data: b64(ct) };
}
async function decryptVault(v, key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(v.iv) }, key, unb64(v.data));
  return JSON.parse(dec.decode(pt));
}
function normalize(d) { const base = emptyDb(); for (const k in base) if (d[k] == null) d[k] = base[k]; return d; }
const cacheKey = () => 'registosTrabalho.cache.' + me;
const readCache = () => { try { return JSON.parse(localStorage.getItem(cacheKey())); } catch { return null; } };
function writeCache(vault) { try { localStorage.setItem(cacheKey(), JSON.stringify({ vault, versao, pendente })); } catch {} }
function setSync(txt, warn) { const e = $('#syncSt'); if (e) { e.textContent = txt; e.className = 'sync' + (warn ? ' warn' : ''); } }
async function fetchRemote() {
  const { data, error } = await sb.from(TABELA).select('dados,versao').eq('dono', me).maybeSingle();
  if (error) throw error;
  return data;
}
// junta duas versões registo a registo (fica a alteração mais recente; apagados são respeitados)
function merge(a, b) {
  const out = { ...b, config: a.config || b.config };
  const ap = { ...(b.apagados || {}) };
  for (const [k, v] of Object.entries(a.apagados || {})) ap[k] = Math.max(ap[k] || 0, v);
  const lim = Date.now() - 180 * 864e5;
  for (const k in ap) if (ap[k] < lim) delete ap[k];
  out.apagados = ap;
  const ts = r => r.alterado || r.criado || 0;
  for (const col of COLS) {
    const m = new Map();
    for (const r of (b[col] || [])) m.set(r.id, r);
    for (const r of (a[col] || [])) { const o = m.get(r.id); if (!o || ts(r) > ts(o)) m.set(r.id, r); }
    out[col] = [...m.values()].filter(r => !(ap[r.id] && ap[r.id] >= ts(r)));
  }
  return normalize(out);
}
const tableMissing = e => e && (e.code === 'PGRST205' || e.code === '42P01' || /registos_cofre/.test(e.message || ''));
// envia o estado atual para a cloud; se outro PC gravou entretanto, junta as duas versões e tenta de novo
async function push() {
  let merged = false;
  for (let t = 0; t < 4; t++) {
    const vault = await encryptDb();
    pendente = true; writeCache(vault);
    if (!navigator.onLine) throw new Error('offline');
    const res = versao === 0
      ? await sb.from(TABELA).insert({ dados: vault, versao: 1 }).select('versao')
      : await sb.from(TABELA).update({ dados: vault, versao: versao + 1 }).eq('dono', me).eq('versao', versao).select('versao');
    if (res.error && res.error.code !== '23505') throw res.error;
    if (!res.error && res.data && res.data.length) { versao = res.data[0].versao; pendente = false; writeCache(vault); return merged; }
    const r = await fetchRemote();
    if (!r) { versao = 0; continue; }
    let remoto; try { remoto = await decryptVault(r.dados, cKey); } catch { throw new Error('chave'); }
    db = merge(db, remoto); versao = r.versao; merged = true;
  }
  throw new Error('Não foi possível sincronizar (conflitos repetidos).');
}
function syncError(e) {
  if (e && e.message === 'chave') { toast('A senha mestra foi alterada noutro computador. Desbloqueie com a nova senha.', true); setTimeout(() => lock(), 0); return; }
  if (tableMissing(e)) { setSync('⚠️ Falta criar a tabela no Supabase', true); return; }
  setSync('⚠️ Sem ligação — guardado neste PC', true);
}
function save() {
  saving = saving.then(async () => {
    if (!cKey || !db) return;
    setSync('⏳ A guardar…');
    try { const merged = await push(); setSync('☁️ Sincronizado'); if (merged && $('#modal').hidden) render(); }
    catch (e) { syncError(e); }
  });
  return saving;
}
// verifica se o outro computador fez alterações
async function poll() {
  if (!db || !cKey) return;
  if (pendente) { try { const merged = await push(); setSync('☁️ Sincronizado'); if (merged && $('#modal').hidden) render(); } catch (e) { syncError(e); } return; }
  try {
    const { data, error } = await sb.from(TABELA).select('versao').eq('dono', me).maybeSingle();
    if (error) throw error;
    if (data && data.versao > versao) {
      const r = await fetchRemote();
      let remoto; try { remoto = await decryptVault(r.dados, cKey); } catch { throw new Error('chave'); }
      if (!db) return;
      db = merge(db, remoto); versao = r.versao; writeCache(r.dados);
      if ($('#modal').hidden) render(); else renderNav();
    }
    setSync('☁️ Sincronizado');
  } catch (e) { syncError(e); }
}
const syncNow = () => { saving = saving.then(poll); return saving; };

/* ---------- ecrã de entrada ---------- */
let lockMode = 'open';
async function showLock(msg) {
  $('#app').hidden = true; $('#modal').hidden = true; $('#lock').hidden = false;
  if (!sb) { $('#loginForm').hidden = false; $('#vaultStep').hidden = true; $('#lgBtn').disabled = true; $('#lgErr').textContent = 'Sem ligação à internet. Ligue-se e recarregue a página (F5).'; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    $('#loginForm').hidden = false; $('#vaultStep').hidden = true;
    $('#lgErr').textContent = msg || '';
    setTimeout(() => $('#lgEmail').focus(), 50);
    return;
  }
  me = data.session.user.email.toLowerCase();
  $('#loginForm').hidden = true; $('#vaultStep').hidden = false;
  $('#lgWho').textContent = '(' + me + ')';
  $('#pw1').value = ''; $('#pw2').value = ''; $('#lockErr').textContent = msg || '';
  $('#lockMsg').textContent = 'A verificar…'; $('#lockBtn').disabled = true; $('#pw2').hidden = true;
  let exists;
  try { exists = !!(await fetchRemote()); }
  catch (e) {
    if (tableMissing(e)) { $('#lockMsg').textContent = 'Falta criar a tabela "registos_cofre" no Supabase (ver instruções, ficheiro registos.sql).'; return; }
    exists = !!readCache();
    if (!exists) { $('#lockMsg').textContent = 'Sem ligação à internet. Ligue-se para entrar pela primeira vez neste computador.'; return; }
  }
  lockMode = exists ? 'open' : 'create';
  $('#pw2').hidden = exists; $('#lnkReset').hidden = !exists;
  $('#lockMsg').textContent = exists ? 'Introduza a senha mestra para desbloquear.'
    : 'Primeira utilização: crie uma senha mestra. Os dados são encriptados com ela antes de irem para a cloud — se a esquecer, não há forma de os recuperar.';
  $('#lockBtn').textContent = exists ? 'Desbloquear' : 'Criar e entrar';
  $('#lockBtn').disabled = false;
  setTimeout(() => $('#pw1').focus(), 50);
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  $('#lgBtn').disabled = true; $('#lgErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#lgEmail').value.trim(), password: $('#lgPw').value });
  $('#lgBtn').disabled = false;
  if (error) { $('#lgErr').textContent = error.message === 'Invalid login credentials' ? 'Email ou senha incorretos.' : error.message; return; }
  $('#lgPw').value = '';
  showLock();
};
$('#lnkLogout').onclick = async () => { await saving; db = null; cKey = null; await sb.auth.signOut(); showLock(); };
$('#lockForm').onsubmit = async e => {
  e.preventDefault();
  const pw = $('#pw1').value, err = $('#lockErr');
  if (!window.crypto || !crypto.subtle) { err.textContent = 'Este navegador não suporta encriptação. Use o Microsoft Edge ou o Chrome.'; return; }
  $('#lockBtn').disabled = true; err.textContent = '';
  try {
    if (lockMode === 'create') {
      if (pw.length < 8) throw new Error('A senha mestra deve ter pelo menos 8 caracteres.');
      if (pw !== $('#pw2').value) throw new Error('As senhas não coincidem.');
      cSalt = crypto.getRandomValues(new Uint8Array(16));
      cKey = await derive(pw, cSalt);
      db = emptyDb(); versao = 0; pendente = false;
      try { await push(); } catch (ex) { cKey = null; db = null; throw new Error(tableMissing(ex) ? 'Falta criar a tabela no Supabase.' : 'Não foi possível gravar na cloud: ' + (ex.message || ex)); }
    } else {
      let src = null, offline = false;
      try { const r = await fetchRemote(); if (r) src = { vault: r.dados, versao: r.versao }; } catch { offline = true; }
      const cache = readCache();
      if (!src && cache) src = { vault: cache.vault, versao: cache.versao };
      if (!src) throw new Error('Não foi possível obter os dados.');
      cSalt = unb64(src.vault.salt);
      const k = await derive(pw, cSalt);
      try { db = normalize(await decryptVault(src.vault, k)); } catch { throw new Error('Senha incorreta.'); }
      cKey = k; versao = src.versao; pendente = false;
      // alterações feitas neste PC sem internet que ainda não foram enviadas
      if (cache && cache.pendente) {
        try { db = merge(normalize(await decryptVault(cache.vault, k)), db); pendente = true; } catch {}
      }
      if (offline) setSync('⚠️ Sem ligação — guardado neste PC', true);
    }
    start();
    if (pendente) save(); else if (lockMode !== 'create') setSync(navigator.onLine ? '☁️ Sincronizado' : '⚠️ Sem ligação — guardado neste PC', !navigator.onLine);
    else setSync('☁️ Sincronizado');
  } catch (ex) { err.textContent = ex.message; }
  finally { $('#lockBtn').disabled = false; }
};
async function lock(msg) {
  await saving;
  db = null; cKey = null; cSalt = null; versao = 0; pendente = false;
  showLock(msg);
}
$('#btnLock').onclick = () => lock();

  const h = new Date().getHours(), saud = h < 12 ? 'Bom dia' : h < 20 ? 'Boa tarde' : 'Boa noite';
  const evLi = e => `<div class="li" data-act="edit" data-m="eventos" data-id="${e.id}"><span class="when">${e.data === hoje ? 'Hoje' : fmtDate(e.data).slice(0, 5)} ${esc(e.hora || '')}</span><span>${esc(e.titulo)}${e.cliente ? ` <span class="muted">· ${esc(cliName(e.cliente))}</span>` : ''}</span></div>`;
  const ocLi = o => `<div class="li" data-act="edit" data-m="ocorrencias" data-id="${o.id}"><span class="when">${fmtDate(o.data)}</span><span style="flex:1">${esc(o.titulo)}${o.cliente ? ` <span class="muted">· ${esc(cliName(o.cliente))}</span>` : ''}</span><span class="badge b-${slug(o.estado || '')}">${esc(o.estado || '')}</span></div>`;
  $('#main').innerHTML = `
    <div class="top"><h2>${saud} 👋</h2><span class="muted">${new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span><span class="sp"></span>
      <button class="btn" data-act="new" data-m="eventos">+ Agendamento</button><button class="btn p" data-act="new" data-m="ocorrencias">+ Ocorrência</button></div>
    <div class="stats">
      <div class="card stat"><span>Ocorrências em aberto</span><b style="color:${abertas.length ? 'var(--bad)' : 'var(--ok)'}">${abertas.length}</b></div>
      <div class="card stat"><span>Agendamentos hoje</span><b>${evHoje.length}</b></div>
      <div class="card stat"><span>Horas registadas este mês</span><b>${String(horas).replace('.', ',')}</b></div>
      <div class="card stat"><span>Clientes</span><b>${db.clientes.length}</b></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>📅 Próximos 7 dias <button class="btn sm" data-act="go" data-v="calendario">Calendário</button></h3>${prox.length ? prox.map(evLi).join('') : '<div class="empty">Sem agendamentos.</div>'}</div>
      <div class="card"><h3>⚠️ Ocorrências em aberto <button class="btn sm" data-act="go" data-v="ocorrencias">Ver todas</button></h3>${abertas.length ? abertas.slice(0, 8).map(ocLi).join('') : '<div class="empty">Tudo resolvido 🎉</div>'}</div>
      <div class="card" style="grid-column:1/-1"><h3>🕘 Últimos registos</h3>${recentes.length ? recentes.map(ocLi).join('') : '<div class="empty">Ainda sem ocorrências registadas.</div>'}</div>
    </div>`;
}

/* ---------- calendário ---------- */
function renderCal() {
  const y = st.calY, m = st.calM, hoje = ymd(new Date()), agora = Date.now();
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, start = new Date(y, m, 1 - off);
  const byDay = {}; db.eventos.forEach(e => (byDay[e.data] = byDay[e.data] || []).push(e));
  const ocDay = {}; db.ocorrencias.forEach(o => ocDay[o.data] = (ocDay[o.data] || 0) + 1);
  let cells = DIAS.map(d => `<div class="h">${d}</div>`).join('');
  const nCells = Math.ceil((off + new Date(y, m + 1, 0).getDate()) / 7) * 7;
  for (let i = 0; i < nCells; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = ymd(d);
    const evs = (byDay[k] || []).sort(MODS.eventos.sort);
    cells += `<div class="d ${d.getMonth() !== m ? 'o' : ''} ${k === hoje ? 't' : ''}" data-act="newday" data-d="${k}"><span class="n">${d.getDate()}</span>
      ${evs.slice(0, 4).map(e => `<span class="ev ${new Date(e.data + 'T' + (e.hora || '23:59')).getTime() < agora ? 'past' : ''}" data-act="edit" data-m="eventos" data-id="${e.id}" title="${esc(e.titulo)}">${e.hora ? esc(e.hora) + ' ' : ''}${esc(e.titulo)}</span>`).join('')}
      ${evs.length > 4 ? `<div class="oc">+${evs.length - 4} mais</div>` : ''}
      ${ocDay[k] ? `<div class="oc">📋 ${ocDay[k]} registo${ocDay[k] > 1 ? 's' : ''}</div>` : ''}</div>`;
  }
  const mk = y + '-' + pad(m + 1), doMes = db.eventos.filter(e => e.data.startsWith(mk)).sort(MODS.eventos.sort);
  $('#main').innerHTML = `
    <div class="top"><h2>📅 ${MESES[m]} ${y}</h2>
      <button class="btn sm" id="cPrev">‹</button><button class="btn sm" id="cHoje">Hoje</button><button class="btn sm" id="cNext">›</button>
      <span class="sp"></span><span class="muted">Clique num dia para agendar</span><button class="btn p" data-act="new" data-m="eventos">+ Agendamento</button></div>
    <div class="cal">${cells}</div>
    <div class="card" style="margin-top:18px"><h3>Agendamentos de ${MESES[m]}</h3>${doMes.length ? `<table><tbody>${doMes.map(e => `<tr><td style="width:110px">${fmtDate(e.data)}</td><td style="width:60px">${esc(e.hora || '')}</td><td>${esc(e.titulo)}</td><td class="muted">${esc(cliName(e.cliente))}</td><td class="muted">${esc(show(fieldOf('eventos', 'aviso'), e.aviso))}</td><td class="act"><button class="ib" data-act="edit" data-m="eventos" data-id="${e.id}">✏️</button><button class="ib" data-act="del" data-m="eventos" data-id="${e.id}">🗑️</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">Sem agendamentos neste mês.</div>'}</div>`;
  $('#cPrev').onclick = () => { st.calM--; if (st.calM < 0) { st.calM = 11; st.calY--; } renderCal(); };
  $('#cNext').onclick = () => { st.calM++; if (st.calM > 11) { st.calM = 0; st.calY++; } renderCal(); };
  $('#cHoje').onclick = () => { const d = new Date(); st.calY = d.getFullYear(); st.calM = d.getMonth(); renderCal(); };
}

/* ---------- definições ---------- */
function renderSet() {
  const perm = 'Notification' in window ? Notification.permission : 'indisponivel';
  const permTxt = { granted: '✅ Ativas', denied: '⛔ Bloqueadas nas definições do navegador', default: 'Ainda não autorizadas', indisponivel: 'Não suportadas' }[perm];
  const total = ['ocorrencias','eventos','clientes','senhas','links','pastas'].reduce((s, k) => s + db[k].length, 0);
  $('#main').innerHTML = `
    <div class="top"><h2>⚙️ Definições</h2></div>
    <div class="card">
      <div class="set"><div><b>Bloqueio automático</b><small>Bloqueia a aplicação após um período sem atividade.</small></div>
        <select id="sLock">${[[0,'Nunca'],[5,'5 minutos'],[15,'15 minutos'],[30,'30 minutos'],[60,'1 hora']].map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
      <div class="set"><div><b>Notificações do Windows</b><small>Avisos dos agendamentos (funcionam enquanto a aplicação está aberta). Estado: ${permTxt}</small></div>
        <button class="btn" id="sNotif" ${perm !== 'default' ? 'disabled' : ''}>Ativar</button> <button class="btn" id="sTest">Testar</button></div>
      <div class="set"><div><b>Cópia de segurança</b><small>Ficheiro encriptado com a sua senha mestra (${total} registos). Os dados já estão na cloud, mas uma cópia extra numa pen nunca faz mal.</small></div>
        <button class="btn p" id="sExp">⬇ Exportar</button> <button class="btn" id="sImp">⬆ Importar</button></div>
      <div class="set"><div><b>Exportar ocorrências (CSV)</b><small>Para abrir no Excel. Atenção: este ficheiro <u>não</u> é encriptado (não inclui senhas).</small></div>
        <button class="btn" id="sCsv">⬇ CSV</button></div>
      <div class="set"><div><b>Alterar senha mestra</b><small>Os dados são encriptados novamente com a nova senha. No outro computador terá de usar a nova senha.</small></div>
        <button class="btn" id="sPw">Alterar</button></div>
      <div class="set"><div><b>Onde ficam os dados?</b><small>Na sua conta Supabase (${esc(me)}), encriptados (AES-256) com a senha mestra <u>antes</u> de saírem deste computador — na cloud só fica texto ilegível. Cada computador guarda também uma cópia encriptada para funcionar sem internet; as alterações são enviadas quando a ligação voltar.</small></div><button class="btn" id="sSync">🔄 Sincronizar agora</button><div style="display:none"></div></div>
    </div>`;
  $('#sLock').value = db.config.autoLock;
  $('#sLock').onchange = e => { db.config.autoLock = +e.target.value; save(); toast('Guardado ✔'); };
  $('#sNotif').onclick = async () => { await Notification.requestPermission(); renderSet(); };
  $('#sTest').onclick = () => notify({ titulo: 'Teste de aviso', hora: new Date().toTimeString().slice(0, 5) });
  $('#sExp').onclick = async () => { await saving; download(`registos-backup-${ymd(new Date())}.json`, JSON.stringify(await encryptDb()), 'application/json'); toast('Cópia de segurança exportada'); };
  $('#sImp').onclick = () => $('#fileImport').click();
  $('#sCsv').onclick = exportCsv;
  $('#sPw').onclick = changePw;
  $('#sSync').onclick = async () => { await syncNow(); toast('Sincronização feita'); };
}
function exportCsv() {
  const F = MODS.ocorrencias.fields;
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [F.map(f => q(f.l)).join(';')].concat(db.ocorrencias.slice().sort(MODS.ocorrencias.sort).map(r => F.map(f => q(f.type === 'number' ? String(r[f.k] ?? '').replace('.', ',') : show(f, r[f.k]))).join(';')));
  download(`ocorrencias-${ymd(new Date())}.csv`, '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8');
}
function changePw() {
  formCtx = null;
  $('#mTitle').textContent = 'Alterar senha mestra';
  $('#mForm').innerHTML = `<div class="fgrid"><label class="full">Senha atual<input type="password" name="a" required></label>
    <label>Nova senha<input type="password" name="n" required minlength="8"></label><label>Confirmar nova senha<input type="password" name="c" required></label></div>
    <div class="foot"><span class="sp"></span><button type="button" class="btn" id="mCancel">Cancelar</button><button class="btn p" id="mPwOk">Alterar</button></div>`;
  $('#mCancel').onclick = closeForm;
  $('#mPwOk').onclick = async e => {
    e.preventDefault();
    const el = $('#mForm').elements;
    if (el.n.value.length < 8) return toast('A nova senha deve ter pelo menos 8 caracteres.');
    if (el.n.value !== el.c.value) return toast('As novas senhas não coincidem.');
    await syncNow();
    try { await decryptVault(await encryptDb(), await derive(el.a.value, cSalt)); } catch { return toast('Senha atual incorreta.'); }
    cSalt = crypto.getRandomValues(new Uint8Array(16));
    cKey = await derive(el.n.value, cSalt);
    await save(); closeForm(); toast('Senha mestra alterada ✔');
  };
  $('#modal').hidden = false;
}

/* ---------- avisos e bloqueio automático ---------- */
function notify(e) {
  const msg = `${e.hora ? e.hora + ' — ' : ''}${e.titulo}${e.cliente ? ' (' + cliName(e.cliente) + ')' : ''}`;
  toast('🔔 ' + msg, true);
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Aviso de agendamento', { body: msg, requireInteraction: true }); } catch {}
}
function checkReminders() {
  if (!db) return;
  const now = Date.now(); let ch = false;
  for (const e of db.eventos) {
    if (e.aviso === '' || e.aviso == null || e.notificado) continue;
    const t = new Date(e.data + 'T' + (e.hora || '09:00')).getTime();
    if (now >= t - Number(e.aviso) * 60000) {
      e.notificado = true; ch = true;
      if (now < t + 3600000) notify(e);
    }
  }
  if (ch) { save(); if (st.view === 'painel' || st.view === 'calendario') render(); }
}
let lastAct = Date.now();
['mousemove','keydown','click','wheel'].forEach(ev => document.addEventListener(ev, () => lastAct = Date.now(), { passive: true }));
setInterval(() => { if (db) syncNow(); }, 30000);
window.addEventListener('online', () => { if (db) syncNow(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && db) syncNow(); });
setInterval(() => {
  checkReminders();
  if (db && db.config.autoLock > 0 && Date.now() - lastAct > db.config.autoLock * 60000) { lock(); toast('Bloqueado por inatividade'); }
}, 20000);

function start() {
  $('#lock').hidden = true; $('#app').hidden = false;
  lastAct = Date.now(); go('painel');
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  checkReminders();
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
showLock();
</script>
